<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 64" fill="none" width="100%" height="100%">
  <!-- Rumaysho Islamic Knowledge Portal Official Identity -->
  <g transform="translate(6, 6)">
    <!-- Rounded Emblem Container -->
    <rect x="0" y="0" width="52" height="52" rx="14" fill="#008453" />
    
    <!-- Stylized Open Book & Blooming Lotus Flourish -->
    <!-- Open Book Base Leaves -->
    <path d="M 26 38 C 21 34 13 35 11 39 C 11 31 19 27 26 29 C 33 27 41 31 41 39 C 39 35 31 34 26 38 Z" fill="#ffffff" />
    
    <!-- Inner Book Pages / Mihrab Arch -->
    <path d="M 26 13 C 24 16 17 21 17 28 C 21 26 24 28 26 30 C 28 28 31 26 35 28 C 35 21 28 16 26 13 Z" fill="#ffffff" />
    
    <!-- Islamic Crescent & Star Accent -->
    <circle cx="26" cy="18" r="2.5" fill="#fef08a" />
  </g>

  <!-- Typography -->
  <g transform="translate(68, 14)">
    <!-- Brand Name: RUMAYSHO -->
    <text 
      x="0" 
      y="22" 
      fill="#008453" 
      font-family="'Manrope', -apple-system, BlinkMacSystemFont, sans-serif" 
      font-weight="800" 
      font-size="24" 
      letter-spacing="0.02em"
    >RUMAYSHO</text>
    
    <!-- Tagline: Mengenal Hukum Islam Lebih Dekat -->
    <text 
      x="1" 
      y="36" 
      fill="#52525b" 
      font-family="'Manrope', -apple-system, BlinkMacSystemFont, sans-serif" 
      font-weight="600" 
      font-size="8.5" 
      letter-spacing="0.04em"
    >MENGENAL HUKUM ISLAM LEBIH DEKAT</text>
  </g>
</svg>
