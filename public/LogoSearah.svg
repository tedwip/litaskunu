<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 64" fill="none" width="100%" height="100%">
  <!-- Searah Partner Logo (Sunnah Tour & Spiritual Journey) -->
  <g transform="translate(6, 6)">
    <!-- Dynamic Directional Circle Badge -->
    <rect x="0" y="0" width="52" height="52" rx="14" fill="#222426" />
    
    <!-- Forward Aligning Arrows / Searah Motif -->
    <!-- Primary Arrow (Gold / Bronze) -->
    <path d="M 14 34 L 26 22 L 38 34 L 33 39 L 26 32 L 19 39 Z" fill="#bfb695" />
    <!-- Secondary Leading Arrow (Terracotta Rose) -->
    <path d="M 19 24 L 26 17 L 33 24 L 30 27 L 26 23 L 22 27 Z" fill="#c38169" />
    <!-- Center Dot Indicator -->
    <circle cx="26" cy="42" r="2.5" fill="#da908f" />
  </g>

  <!-- Typography -->
  <g transform="translate(68, 14)">
    <text 
      x="0" 
      y="22" 
      fill="#222426" 
      font-family="'Manrope', -apple-system, BlinkMacSystemFont, sans-serif" 
      font-weight="800" 
      font-size="24" 
      letter-spacing="0.06em"
    >SEARAH</text>
    <text 
      x="1" 
      y="36" 
      fill="#71717a" 
      font-family="'Manrope', -apple-system, BlinkMacSystemFont, sans-serif" 
      font-weight="600" 
      font-size="8.5" 
      letter-spacing="0.1em"
    >PERJALANAN & DAKWAH SUNNAH</text>
  </g>
</svg>
