<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 72" fill="none" width="100%" height="100%">
  <!-- Left Architectural Arches Group -->
  <g transform="translate(4, 4)">
    <!-- Column 1 -->
    <!-- Top Arch (Col 1, Row 1) -->
    <path d="M 0 22 L 0 8 A 8 8 0 0 1 16 8 L 16 22 Z" fill="#da908f" />
    
    <!-- Middle Arch (Col 1, Row 2) -->
    <path d="M 0 44 L 0 30 A 8 8 0 0 1 16 30 L 16 44 Z" fill="#da908f" opacity="0.9" />
    
    <!-- Bottom Arch (Col 1, Row 3) -->
    <path d="M 0 66 L 0 52 A 8 8 0 0 1 16 52 L 16 66 Z" fill="#bfb695" />

    <!-- Column 2 -->
    <!-- Middle Arch (Col 2, Row 2) -->
    <path d="M 18 44 L 18 30 A 8 8 0 0 1 34 30 L 34 44 Z" fill="#f0be9d" />
    
    <!-- Bottom Arch (Col 2, Row 3) -->
    <path d="M 18 66 L 18 52 A 8 8 0 0 1 34 52 L 34 66 Z" fill="#a4847b" />

    <!-- Column 3 -->
    <!-- Middle Arch (Col 3, Row 2) -->
    <path d="M 36 44 L 36 30 A 8 8 0 0 1 52 30 L 52 44 Z" fill="#c38169" />
    
    <!-- Bottom Arch (Col 3, Row 3) -->
    <path d="M 36 66 L 36 52 A 8 8 0 0 1 52 52 L 52 66 Z" fill="#586f6d" />
  </g>

  <!-- Typography: LITASKUNU PROJECT -->
  <!-- Top line: LITASKUNU -->
  <text 
    x="68" 
    y="38" 
    fill="#222426" 
    font-family="'Manrope', -apple-system, BlinkMacSystemFont, sans-serif" 
    font-weight="800" 
    font-size="28" 
    letter-spacing="0.04em"
  >LITASKUNU</text>

  <!-- Bottom line: PROJECT with circle R -->
  <text 
    x="68" 
    y="65" 
    fill="#222426" 
    font-family="'Manrope', -apple-system, BlinkMacSystemFont, sans-serif" 
    font-weight="800" 
    font-size="28" 
    letter-spacing="0.04em"
  >PROJECT</text>

  <!-- Registered symbol ® -->
  <g transform="translate(242, 45)">
    <circle cx="9" cy="9" r="8" stroke="#222426" stroke-width="2.2" fill="none" />
    <text 
      x="9" 
      y="12.5" 
      fill="#222426" 
      font-family="'Manrope', sans-serif" 
      font-weight="800" 
      font-size="10" 
      text-anchor="middle"
    >R</text>
  </g>
</svg>
